[workspace]
members = ["contracts/relayer-reward-vault", "contracts/oracle-governor"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["AveraChain"]
license = "Apache-2.0"
repository = "https://github.com/averachain/tc-proof-of-delivery"

[workspace.dependencies]
# Alinhado ao tc-cw-hyperlane (mesma toolchain da chain / dos contratos em produção)
cosmwasm-std = { version = "1.5.0", features = ["stargate", "cosmwasm_1_1"] }
cosmwasm-schema = "1.5.0"
cw-storage-plus = "1.2.0"
cw2 = "1.1.2"
serde = { version = "1.0.162", default-features = false, features = ["derive"] }
thiserror = "1.0.37"
cw-multi-test = "0.20.0"
anyhow = "1"
sha3 = { version = "0.10", default-features = false }
hex = { version = "0.4", default-features = false, features = ["alloc"] }

[profile.release]
opt-level = 3
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true
